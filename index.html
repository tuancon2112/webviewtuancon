<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TuanConBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #eaf6ff, #ffffff);
      color: #1f2937;
    }
    .container {
      width: 90%;
      max-width: 500px;
      padding: 45px 30px;
      background: #ffffff;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 102, 204, 0.15);
      border: 1px solid #dbeafe;
    }
    h1 {
      font-size: 32px;
      font-weight: 600;
      color: #0878d1;
      margin-bottom: 15px;
    }
    .welcome {
      font-size: 21px;
      margin-bottom: 30px;
      color: #4b5563;
    }
    .telegram-btn {
      display: inline-block;
      padding: 14px 25px;
      background: #229ed9;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
      transition: 0.25s;
    }
    .telegram-btn:hover {
      background: #1688bd;
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(34, 158, 217, 0.3);
    }
    .support {
      margin-top: 20px;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Xin chào.</h1>
    <div class="welcome">Welcome to <strong>tuanconbot</strong></div>
    <a class="telegram-btn"
       href="https://t.me/tc21128888"
       target="_blank"
       rel="noopener noreferrer">
      Liên hệ Telegram hỗ trợ
    </a>
    <div class="support">Telegram: @tc21128888</div>
  </div>
</body>
</html>
